<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stack10 — Enterprise AI transformation. Coming soon.">
  <title>Stack10 — Coming Soon</title>
  <link rel="icon" type="image/png" sizes="32x32" href="https://stack10-assets.syd1.digitaloceanspaces.com/brand/logo-files/favicon-32x32-and-16x16/32x32.png">

  <!-- Open Graph -->
  <meta property="og:title" content="Stack10 — Coming Soon">
  <meta property="og:description" content="Enterprise AI transformation. Coming soon.">
  <meta property="og:image" content="https://stack10-assets.syd1.digitaloceanspaces.com/brand/logo-files/svg/logo-1.svg">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Stack10">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Manrope', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .coming-soon {
      max-width: 480px;
    }

    .coming-soon__logo {
      height: 40px;
      margin-bottom: 3rem;
    }

    .coming-soon__heading {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    .coming-soon__sub {
      font-size: 1.125rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.6;
    }

    .coming-soon__accent {
      color: #1EE76E;
    }
  </style>
</head>
<body>
  <div class="coming-soon">
    <img
      src="https://stack10-assets.syd1.digitaloceanspaces.com/brand/logo-files/svg/logo-1.svg"
      alt="Stack10"
      class="coming-soon__logo"
    />
    <h1 class="coming-soon__heading">Coming <span class="coming-soon__accent">Soon</span></h1>
    <p class="coming-soon__sub">Enterprise AI transformation measured in production, not promises.</p>
  </div>
</body>
</html>
