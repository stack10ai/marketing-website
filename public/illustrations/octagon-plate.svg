<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Octagonal chip / hardware plate with 3D depth -->

  <!-- 3D depth sides -->
  <!-- Bottom edge -->
  <polygon points="62,152 138,152 162,128 162,138 138,162 62,162 38,138 38,128"
    fill="#0a6632" fill-opacity="0.9"
    stroke="#1EE76E" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Top octagon face -->
  <polygon points="62,48 138,48 162,72 162,128 138,152 62,152 38,128 38,72"
    fill="#0f2e1a" fill-opacity="0.85"
    stroke="#1EE76E" stroke-opacity="0.7" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Inner octagon ring -->
  <polygon points="72,62 128,62 148,82 148,118 128,138 72,138 52,118 52,82"
    fill="none"
    stroke="#1EE76E" stroke-opacity="0.35" stroke-width="1" stroke-linejoin="round"/>

  <!-- Circuit traces -->
  <line x1="100" y1="48" x2="100" y2="62" stroke="#1EE76E" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="138" y1="48" x2="148" y2="62" stroke="#1EE76E" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="62" y1="48" x2="52" y2="62" stroke="#1EE76E" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="162" y1="100" x2="148" y2="100" stroke="#1EE76E" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="38" y1="100" x2="52" y2="100" stroke="#1EE76E" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="100" y1="152" x2="100" y2="138" stroke="#1EE76E" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Central processor grid -->
  <rect x="80" y="80" width="40" height="40" rx="3"
    fill="#1EE76E" fill-opacity="0.12"
    stroke="#1EE76E" stroke-opacity="0.55" stroke-width="1.5"/>
  <!-- Grid lines inside processor -->
  <line x1="80" y1="93" x2="120" y2="93" stroke="#1EE76E" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="80" y1="107" x2="120" y2="107" stroke="#1EE76E" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="93" y1="80" x2="93" y2="120" stroke="#1EE76E" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="107" y1="80" x2="107" y2="120" stroke="#1EE76E" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Corner connection pads -->
  <circle cx="72" cy="82" r="3" fill="#1EE76E" fill-opacity="0.7"/>
  <circle cx="128" cy="82" r="3" fill="#1EE76E" fill-opacity="0.7"/>
  <circle cx="72" cy="118" r="3" fill="#1EE76E" fill-opacity="0.7"/>
  <circle cx="128" cy="118" r="3" fill="#1EE76E" fill-opacity="0.7"/>

  <!-- Small indicator dots on outer edge -->
  <circle cx="100" cy="52" r="2.5" fill="#1EE76E" fill-opacity="0.8"/>
  <circle cx="160" cy="100" r="2.5" fill="#1EE76E" fill-opacity="0.8"/>
  <circle cx="100" cy="148" r="2.5" fill="#1EE76E" fill-opacity="0.8"/>
  <circle cx="40" cy="100" r="2.5" fill="#1EE76E" fill-opacity="0.8"/>
</svg>
