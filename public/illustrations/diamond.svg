<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Gemstone diamond shape -->

  <!-- Crown facets (top half) -->
  <!-- Left crown -->
  <polygon points="100,18 48,80 100,68"
    fill="#7dffc2" fill-opacity="0.9"
    stroke="#1EE76E" stroke-opacity="0.4" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Right crown -->
  <polygon points="100,18 152,80 100,68"
    fill="#4af09a" fill-opacity="0.9"
    stroke="#1EE76E" stroke-opacity="0.4" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Crown girdle left -->
  <polygon points="48,80 100,68 100,96"
    fill="#1EE76E" fill-opacity="0.85"
    stroke="#1EE76E" stroke-opacity="0.4" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Crown girdle right -->
  <polygon points="152,80 100,68 100,96"
    fill="#17c45c" fill-opacity="0.85"
    stroke="#1EE76E" stroke-opacity="0.4" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Girdle band -->
  <polygon points="48,80 152,80 100,96"
    fill="#2de87a" fill-opacity="0.8"
    stroke="#1EE76E" stroke-opacity="0.45" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Pavilion facets (bottom half) -->
  <!-- Left pavilion -->
  <polygon points="48,80 100,96 100,182"
    fill="#1EE76E" fill-opacity="0.75"
    stroke="#1EE76E" stroke-opacity="0.4" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Right pavilion -->
  <polygon points="152,80 100,96 100,182"
    fill="#0d9447" fill-opacity="0.8"
    stroke="#1EE76E" stroke-opacity="0.4" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Shine highlight on top facet -->
  <polygon points="100,18 80,52 100,44"
    fill="#ffffff" fill-opacity="0.3"/>
</svg>
