<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="sphereFill" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#6effc0" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#1EE76E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a6632" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="sphereShine" cx="33%" cy="28%" r="38%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphereGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#1EE76E" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1EE76E" stop-opacity="0.18"/>
    </radialGradient>
    <clipPath id="sphereClip">
      <circle cx="100" cy="100" r="82"/>
    </clipPath>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="95" fill="url(#sphereGlow)"/>

  <!-- Main sphere fill -->
  <circle cx="100" cy="100" r="82" fill="url(#sphereFill)"/>

  <!-- Wireframe grid lines clipped to sphere -->
  <g clip-path="url(#sphereClip)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1">
    <!-- Latitude lines -->
    <ellipse cx="100" cy="100" rx="82" ry="22"/>
    <ellipse cx="100" cy="100" rx="82" ry="50"/>
    <ellipse cx="100" cy="72" rx="65" ry="18"/>
    <ellipse cx="100" cy="128" rx="65" ry="18"/>
    <!-- Longitude lines -->
    <ellipse cx="100" cy="100" rx="22" ry="82"/>
    <ellipse cx="100" cy="100" rx="50" ry="82"/>
  </g>

  <!-- Shine highlight -->
  <circle cx="100" cy="100" r="82" fill="url(#sphereShine)"/>

  <!-- Outer border -->
  <circle cx="100" cy="100" r="82" stroke="#1EE76E" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
